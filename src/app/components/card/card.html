<div class="card flex flex-col w-[90%] mx-auto border-solid border-blue-500 border-2 rounded-md p-3">
    <img class="rounded-t-md" src="https://placehold.co/200x200" alt="">
    <h2 class="text-3xl">{{produto.name}}</h2>
    <p class="text-sm">{{produto.description}}</p>
    <div class="flex">
        <span class="text-2xl">R$</span>
        <span class="text-md">@if (produto.price) {produto.price} @else {00,00}</span>
    </div>
    <app-button>Adicionar ao carrinho</app-button>
</div>
